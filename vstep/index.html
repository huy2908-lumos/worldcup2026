<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSTEP Bậc 4 – Phòng luyện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: phòng luyện thi nghiêm túc, gọn, như phiếu trả lời có bút đỏ giám khảo.
   IDEA: phiếu trả lời + bút đỏ chấm bài.
   PICTURE: thước điểm 0–10 với vạch B1/B2/C1, kim điểm hiện tại và mục tiêu.
   COLOUR and TYPE: giấy trắng, mực xanh bi (bài làm), đỏ bút chấm (sửa lỗi); Be Vietnam Pro.
   LAYOUT: thanh tab trên, nội dung 1 cột rộng ≤1180px, đề – bài làm hai cột trên màn rộng. */
:root{color-scheme:light dark;
--bg:light-dark(#f6f6f3,#121317);--card:light-dark(#ffffff,#1b1d22);--ink:light-dark(#16181d,#ecedf0);--mute:light-dark(#5d6270,#9aa0ad);
--line:light-dark(#e3e3de,#2c2f37);--blue:light-dark(#2343c9,#8aa2ff);--blue-soft:light-dark(#e9edfc,#1f2742);
--red:light-dark(#d42a22,#ff7a6e);--red-soft:light-dark(#fdeceb,#3a1f1e);--ok:light-dark(#137a43,#5fd394);--ok-soft:light-dark(#e6f5ec,#17301f);--warn:light-dark(#9a5b00,#f3b25a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;text-wrap:balance}h1{font-size:clamp(26px,4vw,40px);font-weight:800}h2{font-size:22px;font-weight:700}h3{font-size:17px;font-weight:700}
p{margin:.4em 0 .8em}a{color:var(--blue)}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.nav{display:flex;gap:2px;overflow-x:auto;max-width:1180px;margin:auto;padding:0 max(3vw,12px)}
.nav a{flex:none;padding:14px 14px;text-decoration:none;color:var(--mute);font-weight:600;font-size:15px;border-bottom:3px solid transparent}
.nav a.on{color:var(--ink);border-color:var(--red)}
main{max-width:1180px;margin:auto;padding:24px max(3vw,14px) 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
button,.btn{font:600 15px "Be Vietnam Pro",sans-serif;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}button.red{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
select,input[type=text]{font:16px "Be Vietnam Pro",sans-serif;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:220px;font:17px/1.7 "Be Vietnam Pro",sans-serif;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--blue);resize:vertical}
.mute{color:var(--mute)}.small{font-size:14px}.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue)}
.tag.r{background:var(--red-soft);color:var(--red)}.tag.g{background:var(--ok-soft);color:var(--ok)}
.prompt{border-left:4px solid var(--ink);padding:10px 16px;background:var(--bg);border-radius:0 10px 10px 0}
.timer{font:800 26px "Be Vietnam Pro",system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}.timer.low{color:var(--red)}
.q{padding:12px 0;border-top:1px solid var(--line)}.q:first-child{border-top:0}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin-top:6px}@media(max-width:600px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;min-height:44px}
.opt input{margin-top:5px;flex:none;width:18px;height:18px}.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.passage{max-height:70vh;overflow:auto;padding-right:8px}.passage p{margin:0 0 1em}
@media(min-width:821px){.sticky{position:sticky;top:64px;align-self:start}}
.wc{font-weight:700;font-variant-numeric:tabular-nums}.wc.bad{color:var(--red)}.wc.good{color:var(--ok)}
.fix{padding:10px 0;border-top:1px dashed var(--line)}.fix:first-child{border-top:0}
.fix s{color:var(--red);text-decoration-thickness:2px}.fix .rt{color:var(--red);font-weight:600}
.score{font:800 40px "Be Vietnam Pro",system-ui,sans-serif;line-height:1}.crit{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.crit b{font-variant-numeric:tabular-nums}
.gauge{position:relative;height:150px;margin:8px 0 4px}
.gauge svg{position:absolute;inset:0;width:100%;height:100%}
.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:600}
.steps span.on{background:var(--ink);color:var(--card);border-color:var(--ink)}.steps span.done{border-color:var(--ok);color:var(--ok)}
.plan li{margin:4px 0}.today{outline:2px solid var(--red);border-radius:8px}
.tx p{margin:.2em 0}.tx b{color:var(--blue)}
.loading{display:inline-flex;gap:8px;align-items:center;color:var(--mute)}.loading:before{content:"";width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}@media(prefers-reduced-motion:reduce){.loading:before{animation:none}}
.note{background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-size:15px}
.bad-note{background:var(--red-soft);border-radius:10px;padding:10px 14px;font-size:15px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{font-size:14px;color:var(--mute)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><nav class="nav" id="nav"></nav></div>
<main id="app"><p class="loading">Đang tải bộ đề…</p></main>
<script>
{
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=s=>esc(s).replace(/\*\*\s*\*\*/g,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(?!\s)(.+?)\*/g,'<i>$1</i>');
const paras=s=>String(s||'').split(/\n\s*\n|\n/).filter(x=>x.trim()).map(p=>`<p>${md(p)}</p>`).join('');
const words=s=>(String(s).trim().match(/[A-Za-zÀ-ỹ0-9'’-]+/g)||[]).length;
const r05=x=>Math.round(x*2)/2;
const level=x=>x>=8.5?'C1 – Bậc 5':x>=6?'B2 – Bậc 4':x>=4?'B1 – Bậc 3':'Chưa đạt bậc';
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const EXAM=new Date('2026-12-04T07:00:00+07:00');
let T=[];               // tests
let cap={};             // capabilities
let store={attempts:[],errors:[],drafts:{},hist:{}};
let stopTimers=[];
const DICT={final:null,state:null};
const clearTimers=()=>{stopTimers.forEach(f=>f());stopTimers=[]};
function timer(el,sec,onEnd){let left=sec;const tick=()=>{el.textContent=fmt(Math.max(left,0));el.classList.toggle('low',left<=300&&sec>300||left<=15&&sec<=300);if(left<=0){stop();onEnd&&onEnd();}left--};const id=setInterval(tick,1000);tick();const stop=()=>clearInterval(id);stopTimers.push(stop);return {stop,left:()=>left}}

/* ---------- persistence ---------- */
let dbRef=null,saving=Promise.resolve();
function lsLoad(){try{const v=localStorage.getItem('vstep4');if(v)store=JSON.parse(v)}catch(e){}}
function persist(){store.attempts=store.attempts.slice(-200);store.errors=store.errors.slice(-400);
  try{localStorage.setItem('vstep4',JSON.stringify(store))}catch(e){}
  if(dbRef){const data=JSON.parse(JSON.stringify(store));saving=saving.then(()=>dbRef.set(data)).catch(()=>{})}}
function addAttempt(a){store.attempts.push({ts:Date.now(),...a});persist()}
function addErrors(list,skill,src){let n=0;for(const e of list||[]){if(!e.wrong||!e.right)continue;if(store.errors.some(x=>x.wrong===e.wrong&&x.right===e.right))continue;store.errors.push({id:Date.now()+'-'+n++,ts:Date.now(),skill,src,wrong:e.wrong,right:e.right,type:e.type||'',why:e.why||'',ok:0});}persist();return n}

/* ---------- Claude helpers (API key của người dùng) ---------- */
const KEY_LS='vstep4_key',MODEL_LS='vstep4_model';
const getKey=()=>{try{return localStorage.getItem(KEY_LS)||''}catch(e){return ''}};
const getModel=()=>{try{return localStorage.getItem(MODEL_LS)||'claude-sonnet-5-5'}catch(e){return 'claude-sonnet-5-5'}};
async function callClaude(prompt,max){const key=getKey();
  window.__lastPrompt='Hãy chấm bài dưới đây như giám khảo VSTEP. BỎ QUA yêu cầu trả JSON: trả lời bằng tiếng Việt dễ đọc gồm điểm từng tiêu chí, danh sách lỗi dạng "sai → đúng (giải thích)", 3 việc cần sửa ngay và bản viết lại B2.\n\n'+prompt;
  if(!key)throw {nokey:true,message:'Chưa nhập API key nên trang chưa tự chấm được. Anh có thể copy bài sang Claude để chấm, hoặc nhập key ở trang Tổng quan.'};
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:getModel(),max_tokens:max,messages:[{role:'user',content:prompt}]})})}
  catch(e){throw {message:'Không kết nối được tới Claude. Kiểm tra mạng rồi bấm lại.'}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const m=(d.error&&d.error.message)||String(r.status);
    throw {nokey:r.status===401,message:r.status===401?'API key không đúng hoặc đã bị xóa. Vào Tổng quan nhập lại.':r.status===429?'Đang bị giới hạn lượt, đợi 1 phút rồi bấm lại.':/credit|billing/i.test(m)?'Tài khoản API đã hết credit – nạp thêm tại console.anthropic.com.':'Lỗi từ Claude: '+m}}
  return (d.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('')}
async function askJSON(prompt){const t=await callClaude(prompt+'\n\nRespond with the JSON object only, no markdown fences.',6000);
  try{return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}catch(e){throw {message:'Kết quả chấm bị lỗi định dạng, anh bấm chấm lại.'}}}
async function askText(prompt){return callClaude(prompt,700)}
function errBox(e){return `<div class="bad-note">${esc(e.message)}${e.nokey?`<div class="row" style="margin-top:10px"><button class="small pri" id="cpprompt">Copy bài + yêu cầu chấm</button><a class="btn small" style="display:inline-flex;align-items:center;text-decoration:none" href="https://claude.ai/new" target="_blank" rel="noopener">Mở Claude để dán</a></div>`:''}</div>`}
document.addEventListener('click',e=>{if(e.target.id!=='cpprompt')return;const b=e.target;(navigator.clipboard?navigator.clipboard.writeText(window.__lastPrompt||''):Promise.reject()).then(()=>{b.textContent='Đã copy ✓ – dán vào Claude'},()=>{b.textContent='Không copy được'})});
function makeDictation(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;let rec=null,fin=null,st=null;
  return {onFinal(f){fin=f},onState(f){st=f},
    start(){rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=false;
      rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal&&fin)fin({text:ev.results[i][0].transcript})};
      rec.onstart=()=>st&&st({state:'listening'});rec.onend=()=>st&&st({state:'idle'});rec.onerror=()=>st&&st({state:'idle'});
      try{rec.start()}catch(e){return Promise.reject(e)}return Promise.resolve()},
    stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()}}}

/* ---------- speech ---------- */
const VOICE={A:'buttery',B:'airy'};
function voiceFor(sp){if(!sp)return 'rounded';if(VOICE[sp])return VOICE[sp];return /woman|girl|mother|mrs|ms|sarah|kate|jane|lisa|mary/i.test(sp)?'airy':'glassy'}
async function speakLines(lines,rate=1){
  if(!lines||!lines.length)return;
  if(cap.tts){return cap.tts.speak(lines.map(l=>({text:l.t.slice(0,1900),voice:voiceFor(l.sp),language:'en',rate})))}
  if('speechSynthesis' in window){const vs=await bestVoices();return new Promise(res=>{speechSynthesis.cancel();lines.forEach((l,i)=>{const u=new SpeechSynthesisUtterance(l.t);u.lang='en-GB';u.rate=rate*.9;if(vs.length)u.voice=vs[(l.sp==='B'?1:0)%vs.length];if(i===lines.length-1){u.onend=res;u.onerror=res}speechSynthesis.speak(u)})})}
  throw {message:'Trình duyệt này không đọc được âm thanh.'}
}
function stopSpeak(){try{cap.tts&&cap.tts.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}try{curAudio&&curAudio.pause()}catch(e){}document.querySelectorAll('audio').forEach(a=>a.pause())}
let curAudio=null,AUDIO=new Set();
async function bestVoices(){let v=speechSynthesis.getVoices();if(!v.length){await new Promise(r=>{speechSynthesis.onvoiceschanged=r;setTimeout(r,1500)});v=speechSynthesis.getVoices()}
  const en=v.filter(x=>/^en[-_]/i.test(x.lang));const score=x=>(/natural|neural|premium|enhanced|google/i.test(x.name)?10:0)+(/en[-_]GB/i.test(x.lang)?3:/en[-_]US/i.test(x.lang)?2:0)+(x.localService?0:1);
  return en.sort((a,b)=>score(b)-score(a)).slice(0,2)}
const playMp3=(src,rate=1)=>new Promise((res,rej)=>{stopSpeak();const a=new Audio(src);curAudio=a;a.playbackRate=rate;a.onended=res;a.onerror=()=>rej({message:'Không tải được file nghe, kiểm tra mạng.'});a.play().catch(()=>rej({message:'Trình duyệt chặn phát âm thanh, bấm lại.'}))});
document.addEventListener('play',e=>{document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);

/* ---------- plan (11 tối) ---------- */
const PLAN=[
['2026-11-23','Học khung luận 5 đoạn. Viết Task 2 Test 7 (40\')','Nói Part 1: 6 chủ đề quen',[['writing','7','2'],['speaking','1','1']]],
['2026-11-24','Khung thư thân mật. Task 1 Test 2 + Test 7','Nói Part 2 Test 2 + 7; Nghe Part 1',[['writing','2','1'],['speaking','2','2'],['listening','1','1']]],
['2026-11-25','Dạng ý kiến. Task 2 Test 2','Nói Part 3 Test 2 + 7; Đọc 2 bài',[['writing','2','2'],['speaking','2','3'],['reading','1','1']]],
['2026-11-26','Thư trang trọng + Dạng 4. Viết 1 thư 20\'','Nói Part 1 thêm chủ đề; Nghe Part 2',[['writing','10','1'],['listening','2','2']]],
['2026-11-27','Viết trọn 60\' Test 1','Nói trọn Test 1',[['writing','1','2'],['speaking','1','1']]],
['2026-11-28','THI THỬ trọn 4 kỹ năng Test 3','19:00–22:15',[['mock','3']]],
['2026-11-29','Sửa đề thi thử, viết lại Task 2 Test 3','Kiểm email ca thi',[['writing','3','2'],['errors']]],
['2026-11-30','Viết trọn 60\' Test 4','Nói Test 4; Nghe Part 3',[['writing','4','2'],['speaking','4','1'],['listening','4','3']]],
['2026-12-01','Viết trọn 60\' Test 5','Nói Test 5; Đọc 1 bài',[['writing','5','2'],['speaking','5','1'],['reading','5','1']]],
['2026-12-02','THI THỬ trọn 4 kỹ năng Test 6','Mốc: Viết ≥5.5, Nói ≥6.0',[['mock','6']]],
['2026-12-03','Nhẹ: 1 Task 1 20\', Nói Part 2–3','Soạn CCCD, ngủ trước 23:00',[['writing','8','1'],['speaking','8','2']]]];
const todayStr=()=>new Date(Date.now()+7*3600e3).toISOString().slice(0,10);

/* ---------- routing ---------- */
const ROUTES=[['home','Tổng quan'],['mock','Thi thử'],['listening','Nghe'],['reading','Đọc'],['writing','Viết'],['speaking','Nói'],['errors','Sổ lỗi']];
let param={},lastP={};
const ART=location.href.split('#')[0];
const hashOf=(r,p={})=>r+(p.test?'-t'+p.test:'')+(p.part?'-p'+p.part:'')+(p.mode?'-'+p.mode:'');
function go(r,p={}){param=p;const h=hashOf(r,p);if(location.hash!=='#'+h)location.hash=h;else render()}
function linkBtn(){return `<button class="small" style="min-height:38px" id="cplink">🔗 Copy link bài này</button>`}
document.addEventListener('click',e=>{if(e.target.id!=='cplink')return;const u=ART+location.hash;const b=e.target;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{b.textContent='Đã copy link ✓'},()=>{b.outerHTML=`<input type="text" readonly value="${u}" style="width:100%" onclick="this.select()">`})});
window.addEventListener('hashchange',render);
function render(){clearTimers();stopSpeak();const h=(location.hash||'#home').slice(1);const m=h.match(/^([a-z]+)(?:-t(\d+))?(?:-p(\w+?))?(?:-(full|step))?$/)||[];const r=m[1]||'home';
  if(m[2]||m[3]||m[4])param={test:m[2],part:m[3],mode:m[4]};
  const route=ROUTES.some(x=>x[0]===r)?r:'home';
  $('#nav').innerHTML=ROUTES.map(([k,v])=>`<a href="#${k}" class="${k===route?'on':''}">${v}</a>`).join('');
  lastP=param;
  ({home:Home,mock:Mock,listening:Listening,reading:Reading,writing:Writing,speaking:Speaking,errors:Errors})[route]();
  const p=param;param={};return p}
const testSel=(id,v)=>`<select id="${id}">${T.map(t=>`<option value="${t.id}" ${+v===t.id?'selected':''}>Test ${t.id}</option>`).join('')}</select>`;
const LMAP={L:['L'],R:['R'],W:['W','W2'],S:['S','Sp']};
const latest=skill=>{const a=store.attempts.filter(x=>(LMAP[skill]||[skill]).includes(x.skill)&&x.score!=null);return a.length?a[a.length-1].score:null};

/* ---------- HOME ---------- */
function Home(){
  const base={L:5.5,R:6.5,W:3.5,S:5.5},cur={L:latest('L')??base.L,R:latest('R')??base.R,W:latest('W')??base.W,S:latest('S')??base.S};
  const avg=(cur.L+cur.R+cur.W+cur.S)/4,ov=r05(avg);
  const days=Math.max(0,Math.ceil((EXAM-Date.now())/864e5));const td=todayStr();
  const mocks=store.attempts.filter(a=>a.skill==='MOCK');
  $('#app').innerHTML=`
  <div class="card">
    <div class="row" style="justify-content:space-between"><div><h1>Đích đến: 6.0 – Bậc 4</h1><p class="mute">Thi 04–06/12/2026 tại ĐH Văn Lang · còn <b>${days} ngày</b>. Cần tổng 4 kỹ năng ≥ 23.0.</p></div>
    <div style="text-align:right"><div class="score" style="color:${ov>=6?'var(--ok)':'var(--red)'}">${ov.toFixed(1)}</div><div class="small mute">ước tính hiện tại · ${level(ov)}</div></div></div>
    <div class="gauge" id="gauge"><svg></svg></div>
    <div class="grid4">${[['L','Nghe',5.5],['R','Đọc',6.5],['W','Viết',5.5],['S','Nói',6.0]].map(([k,n,goal])=>`<div class="card" style="margin:0;padding:12px 14px"><div class="small mute">${n} · mục tiêu ${goal.toFixed(1)}</div><div style="font-size:28px;font-weight:800;color:${cur[k]>=goal?'var(--ok)':'var(--ink)'}">${cur[k].toFixed(1)}</div><div class="small mute">${latest(k)==null?'điểm thi 8/2026':'lần luyện gần nhất'}</div></div>`).join('')}</div>
  </div>

/* ---------- MCQ renderer ---------- */
function mcqHTML(qs,pre,ans={},key=null){return qs.map(q=>`<div class="q" id="${pre}q${q.n}"><b>${q.n}.</b> ${md(q.q)}<div class="opts">${'ABCD'.split('').filter(k=>q.opts[k]!=null).map(k=>{const cls=key?(k===key[q.n]?'right':(ans[q.n]===k?'wrong':'')):'';return `<label class="opt ${cls}"><input type="radio" name="${pre}${q.n}" value="${k}" ${ans[q.n]===k?'checked':''} ${key?'disabled':''}><span><b>${k}.</b> ${md(q.opts[k])}</span></label>`}).join('')}</div>${key&&ans[q.n]!==key[q.n]?`<div class="row small" style="margin-top:6px"><span class="tag r">Đáp án ${key[q.n]}</span><button class="small" style="min-height:34px" data-why="${q.n}">Vì sao?</button><span class="why mute small"></span></div>`:''}</div>`).join('')}
function readAns(pre,qs){const a={};qs.forEach(q=>{const el=document.querySelector(`input[name="${pre}${q.n}"]:checked`);if(el)a[q.n]=el.value});return a}
function bindWhy(qs,key,ans,ctxFn){document.querySelectorAll('[data-why]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.why,q=qs.find(x=>x.n===n),out=b.nextElementSibling;out.innerHTML='<span class="loading">Đang giải thích…</span>';
  try{out.textContent=await askText(`Explain in Vietnamese, at most 70 words, why the correct answer to this VSTEP question is ${key[n]}. Quote the key English phrase from the source (in quotes). The candidate chose ${ans[n]||'nothing'}; say briefly why that is wrong.\nSOURCE:\n${ctxFn(q).slice(0,6000)}\nQUESTION: ${q.q}\nOPTIONS: ${Object.entries(q.opts).map(([k,v])=>k+'. '+v).join(' | ')}`)}catch(e){out.textContent=e.message}})}

      card.querySelectorAll('.q').forEach(e=>e.remove());box.insertAdjacentHTML('beforebegin',mcqHTML(qs,'L',ans,t.keyL));
      box.classList.remove('hide');box.innerHTML=`<details><summary class="small" style="cursor:pointer;min-height:36px">Xem transcript</summary>${(t.transcript[k]||[]).map(l=>`<p>${l.sp?`<b>${esc(l.sp)}:</b> `:''}${esc(l.t)}</p>`).join('')}</details>`});

const STEPS={1:[['Dàn ý','Ghi 3–5 dòng: thư thân mật hay trang trọng, mỗi gạch đầu dòng của đề sẽ trả lời bằng ý gì.'],['Chào + mở thư','Dear …, + 1–2 câu mở (Thanks for your email… / I am writing to…).'],['Thân thư','Mỗi gạch đầu dòng của đề = 1 đoạn 2–4 câu.'],['Kết + ký tên','1–2 câu kết + Best wishes / Yours faithfully + tên tiếng Anh.']],
 2:[['Dàn ý','Dạng đề? 2 ý cho thân bài 1, 2 ý cho thân bài 2, lấy từ 6 ý vạn năng (thời gian, tiền, sức khỏe, kỹ năng, quan hệ, môi trường).'],['Mở bài','~40 từ: In recent years, … has become a matter of public concern. + câu nêu hướng.'],['Thân bài 1','~95 từ: Ý – Giải thích – Ví dụ – Kết quả (The first … is that … This is because … For example, … As a result, …).'],['Thân bài 2','~95 từ: cùng khung 4 câu, mở bằng Another … / On the other hand, …'],['Kết bài','~40 từ: In conclusion, … Therefore, I believe that … Không thêm ý mới.']]};

 2:"In recent years, … has become a matter of public concern. This essay will discuss …\n\nThe first … is that … This is because … For example, … As a result, …\n\nAnother … is that … This means that … For instance, … Therefore, …\n\nIn conclusion, … Therefore, I believe that …"};
function Writing(){const p=param;writingView({test:+(p.test||1),task:+(p.part||2),mode:p.mode||'step'})}
function gradeBlock(g,full,fixable){
  const crit=full?`<div class="row" style="gap:24px;align-items:flex-end"><div><div class="small mute">Điểm ước tính</div><div class="score" style="color:${g.band>=5.5?'var(--ok)':'var(--red)'}">${(+g.band).toFixed(1)}</div></div><div style="flex:1;min-width:220px">${[['Đáp ứng đề','tf'],['Tổ chức','org'],['Từ vựng','voc'],['Ngữ pháp','gra']].map(([l,k])=>`<div class="crit"><span>${l}</span><b>${g[k]??'–'}</b></div>`).join('')}</div></div>`:`<div class="row"><span class="tag ${g.verdict==='Đạt'?'g':'r'}">${esc(g.verdict||'')}</span></div>`;
  return `${crit}<p>${esc(g.summary||g.comment||'')}</p>
  ${g.priorities?.length?`<h3>Sửa ngay</h3><ol>${g.priorities.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
  ${g.errors?.length?`<div class="row" style="justify-content:space-between"><h3 style="margin:0">Bút đỏ: ${g.errors.length} lỗi</h3>${fixable?'<button class="small" style="min-height:38px" id="fixall">Sửa tất cả trong bài</button>':''}</div>${g.errors.map((e,i)=>`<div class="fix"><span class="tag r">${esc(e.type||'lỗi')}</span> <s>${esc(e.wrong)}</s> → <span class="rt">${esc(e.right)}</span>${fixable?` <button class="small" style="min-height:34px;padding:0 10px" data-fix="${i}">Sửa trong bài</button>`:''}<div class="small mute">${esc(e.why||'')}</div></div>`).join('')}`:'<p class="tag g">Không thấy lỗi đáng kể</p>'}
  ${g.paragraphs?.length?`<h3>Nhận xét từng đoạn</h3>${g.paragraphs.map(p=>`<p><b>${esc(p.role)}:</b> ${esc(p.comment)}</p>`).join('')}`:''}
  ${g.next_tip?`<div class="note"><b>Phần tiếp theo:</b> ${esc(g.next_tip)}</div>`:''}

const W_RULES=`VSTEP writing criteria (each 0–10): Task fulfilment (answers every bullet/part of the prompt, right format and tone, enough length), Organization (paragraphing, logical order, linking), Vocabulary (range, accuracy, spelling), Grammar (range, accuracy, sentence structure). Calibrate like a real VSTEP examiner: typical B1 = 4.0–5.5, B2 = 6.0–8.0, C1 = 8.5+. This candidate scored 3.5 before; known weaknesses: sentence structure, spelling, messy organization; ideas are fine. Goal: 5.5+.`;
function writingView({test,task,mode,exam,onDone,draft}){

      const hk=`W-t${test}-p${task}`;store.hist=store.hist||{};(store.hist[hk]=store.hist[hk]||[]).push(r05(+g.band));const hs=store.hist[hk].slice(-6);

      const fixOne=(e,b)=>{const a=$('#wtxt');if(!a)return false;let i=a.value.indexOf(e.wrong);if(i<0)i=a.value.toLowerCase().indexOf(e.wrong.toLowerCase());

      document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>fixOne(g.errors[+b.dataset.fix],b));

      $('#wsave').onclick=()=>{const n=addErrors(g.errors,'W',`T${test} Task ${task}`);$('#wsave').textContent=`Đã lưu ${n} lỗi mới`;$('#wsave').disabled=true};
      const sc=r05(+g.band);addAttempt({skill:'W'+task,label:`Viết T${test} Task ${task}`,score:sc});if(onDone)onDone({score:sc,g});
    }catch(e){$('#wright').innerHTML=`<h2>Bút đỏ</h2>${errBox(e)}`;btn.disabled=false;if(onDone&&exam)onDone({score:null,err:e.message,text})}};
  if(mode==='full'||exam){
    $('#wleft').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Bài làm</h2>${exam?'':'<span class="timer" id="wtm"></span>'}</div>${ta('wtxt',task===1?'Dear …,':'In recent years, …',draft||'')}<div class="row" style="margin-top:10px"><button class="red" id="wsub">${exam?'Xong Task này':'Nộp & chấm'}</button>${exam?'':'<button id="wnew">Làm lại từ đầu</button>'}</div>`;

      $('#wtxtwc').parentElement.insertAdjacentHTML('afterend','<span class="small mute" id="dsaved">Bài nháp tự lưu</span>')}

      try{const g=await askJSON(`You are a VSTEP writing tutor. ${W_RULES}

Judge only the current section (for "Dàn ý": does it identify the right essay/letter type and cover every part of the prompt?). Return JSON only, Vietnamese feedback:

        $('#wsave').onclick=()=>{const n=addErrors(g.errors,'W',`T${test} Task ${task} · ${steps[st][0]}`);$('#wsave').textContent=`Đã lưu ${n}`;$('#wsave').disabled=true};
        $('#wuse').onclick=()=>{if(g.improved){$('#wpart').value=g.improved;$('#wpart').oninput()}};

/* ---------- SPEAKING ---------- */
function Speaking(){const p=param;speakingView({test:+(p.test||1),part:+(p.part||1)})}
function speakingView({test,part,exam,onDone}){
  const t=T[test-1],s=t.speaking;let qText='',prep=0,talk=0;
  if(part===1){qText=s.part1.map(x=>`Let's talk about ${x.topic.replace(/\.$/,'')}.\n`+x.qs.map((q,i)=>`${i+1}. ${q}`).join('\n')).join('\n\n');prep=0;talk=180}
  if(part===2){qText=s.part2+'\nWhich do you think is the best choice?';prep=60;talk=120}
  if(part===3){qText=`Topic: ${s.part3.topic}\n${s.part3.ideas.map(x=>'- '+x).join('\n')}\n\nFollow-up questions:\n${s.part3.follow.map(x=>'- '+x).join('\n')}`;prep=60;talk=240}
  const frame={1:'A–R–E: Answer (Yes, I do / Actually, …) → Reason (because …) → Example (For example, last week I …). Mỗi câu hỏi nói 3 câu.',2:'In my opinion, [A] is the best option because of the following reasons. Firstly, … Secondly, … Meanwhile, [B] is not a good choice because … and [C] … That\'s why I would choose [A].',3:'Nowadays, more and more people are concerned about … I totally agree that … for the following reasons. (3 gợi ý) Apart from that, in my own opinion, … In short, … Sau đó trả lời 3 câu hỏi phụ.'}[part];
  $('#app').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h1 style="margin:0">Nói · Test ${test} · Part ${part}</h1>${exam?'':`<div class="row">${linkBtn()}${testSel('st',test)}<select id="sp">${[1,2,3].map(i=>`<option value="${i}" ${i==part?'selected':''}>Part ${i} – ${['Tương tác xã hội','Thảo luận giải pháp','Phát triển chủ đề'][i-1]}</option>`).join('')}</select></div>`}</div>
   <div class="prompt" style="margin-top:12px">${paras(qText)}</div><p class="small mute"><b>Khung:</b> ${esc(frame)}</p></div>
   <div class="grid2"><div class="card" style="margin:0"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Bài nói</h2><span class="timer" id="stm">${fmt(prep||talk)}</span></div>
     <p class="small mute" id="sstate">${prep?'Bấm Bắt đầu: 1 phút chuẩn bị (ghi từ khóa), rồi nói.':'Bấm Bắt đầu: máy đọc câu hỏi, anh trả lời.'}</p>
     <div class="row"><button class="pri" id="sgo">Bắt đầu</button><button id="smic" class="${cap.dictation?'':'hide'}">🎙 Ghi âm → chữ</button><button id="sread">🔊 Nghe câu hỏi</button></div>
     <textarea id="stxt" spellcheck="false" style="margin-top:10px;min-height:200px" placeholder="${cap.dictation?'Bấm Ghi âm và nói; chữ sẽ hiện ở đây. Có thể sửa tay.':'Trình duyệt này chưa ghi âm được (dùng Chrome để ghi âm), hoặc dùng micro của bàn phím điện thoại, hoặc gõ lại lời nói.'}"></textarea>
     <div class="row small" style="justify-content:space-between"><span>Số từ: <b id="swc">0</b> <span class="mute">(mục tiêu ${part===1?'≥ 150':part===2?'≥ 220':'≥ 320'})</span></span></div>
     <div class="row" style="margin-top:10px"><button class="red" id="ssub">${exam?'Xong phần này':'Chấm bài nói'}</button></div></div>
   <div class="card" style="margin:0" id="sright"><h2>Bút đỏ</h2><p class="mute">Claude chấm từ văn bản lời nói: ngữ pháp, từ vựng, cách phát triển ý, độ dài. Chưa chấm được phát âm.</p></div></div>`;
  if(!exam){$('#st').onchange=$('#sp').onchange=()=>go('speaking',{test:$('#st').value,part:$('#sp').value})}
  const ta=$('#stxt');ta.oninput=()=>$('#swc').textContent=words(ta.value);
  $('#sread').onclick=()=>speakLines(qText.split('\n').filter(Boolean).map(x=>({sp:'',t:x.replace(/^- /,'')}))).catch(()=>{});
  let listening=false;
  if(cap.dictation){DICT.final=text=>{ta.value=(ta.value+' '+text).trim();ta.oninput()};DICT.state=state=>{listening=state==='listening';const b=$('#smic');if(b)b.textContent=listening?'■ Dừng ghi':'🎙 Ghi âm → chữ'};
    $('#smic').onclick=()=>{if(listening){cap.dictation.stop().catch(()=>{});return}stopSpeak();cap.dictation.start().catch(e=>{$('#sstate').textContent=e&&e.code==='not_granted'?'Micro chưa được cho phép – anh gõ lại lời nói.':'Không mở được micro.'})}}
  $('#sgo').onclick=()=>{$('#sgo').disabled=true;const startTalk=()=>{$('#sstate').textContent='Nói ngay! Hết giờ sẽ tự dừng.';if(cap.dictation&&!listening){$('#sstate').textContent+=' Bấm 🎙 để ghi.'}timer($('#stm'),talk,()=>{$('#sstate').textContent='Hết giờ.';if(listening)cap.dictation.stop().catch(()=>{})})};
    speakLines(qText.split('\n').filter(Boolean).slice(0,part===1?4:6).map(x=>({sp:'',t:x.replace(/^- /,'')}))).catch(()=>{});
    if(prep){$('#sstate').textContent='Chuẩn bị 1 phút: chỉ ghi từ khóa.';timer($('#stm'),prep,startTalk)}else startTalk()};
  $('#ssub').onclick=async()=>{clearTimers();if(listening)await cap.dictation.stop().catch(()=>{});const text=ta.value.trim();if(exam){onDone&&onDone({text,defer:true,qText});return}
    if(words(text)<10){$('#sright').innerHTML='<h2>Bút đỏ</h2><p class="bad-note">Chưa có nội dung để chấm.</p>';return}
    $('#sright').innerHTML='<h2>Bút đỏ</h2><p class="loading">Đang chấm bài nói…</p>';
    try{const g=await gradeSpeaking(part,qText,text);$('#sright').innerHTML='<h2>Bút đỏ</h2>'+speakBlock(g)+`<div class="row" style="margin-top:12px"><button id="ssave">Lưu lỗi</button></div>`;
      $('#ssave').onclick=()=>{const n=addErrors(g.errors,'S',`T${test} Part ${part}`);$('#ssave').textContent=`Đã lưu ${n}`;$('#ssave').disabled=true};
      addAttempt({skill:'Sp',label:`Nói T${test} Part ${part}`,score:r05(+g.band)})}catch(e){$('#sright').innerHTML=`<h2>Bút đỏ</h2>${errBox(e)}`}};
}
async function gradeSpeaking(part,qText,text){return askJSON(`You are a VSTEP speaking examiner. Criteria (0–10 each): Grammar, Vocabulary, Discourse management (answering fully, developing ideas with reasons and examples, organization), plus a Length/fluency estimate from the amount said (Part 1 ≈3 min, Part 2 ≈2 min, Part 3 ≈4 min incl. follow-ups). Pronunciation cannot be judged from text: ignore it. Calibrate: B1 4.0–5.5, B2 6.0–8.0. The candidate scored 5.5 before and aims for 6.0. This is an automatic speech-to-text transcript: ignore punctuation and obvious recognition slips.
PART ${part} QUESTIONS:\n${qText}\n\nTRANSCRIPT (${words(text)} words):\n"""${text}"""\n
Return JSON only, Vietnamese feedback: {"gra":n,"voc":n,"dis":n,"len":n,"band":n (mean rounded to 0.5),"summary":"2–3 câu","priorities":["3 việc cụ thể để lên 6.0"],"errors":[{"wrong":"exact words","right":"corrected","type":"ngữ pháp|từ vựng|cấu trúc câu|phát triển ý","why":"tiếng Việt"}] (up to 10),"better":"a model answer in English at solid B2 using the candidate's own ideas, about 30% longer"}`)}
function speakBlock(g){return `<div class="row" style="gap:24px;align-items:flex-end"><div><div class="small mute">Điểm ước tính</div><div class="score" style="color:${g.band>=6?'var(--ok)':'var(--red)'}">${(+g.band).toFixed(1)}</div></div><div style="flex:1;min-width:200px">${[['Ngữ pháp','gra'],['Từ vựng','voc'],['Phát triển ý','dis'],['Độ dài / trôi chảy','len']].map(([l,k])=>`<div class="crit"><span>${l}</span><b>${g[k]??'–'}</b></div>`).join('')}</div></div>
 <p>${esc(g.summary||'')}</p>${g.priorities?.length?`<h3>Để lên 6.0</h3><ol>${g.priorities.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
 ${(g.errors||[]).map(e=>`<div class="fix"><span class="tag r">${esc(e.type||'lỗi')}</span> <s>${esc(e.wrong)}</s> → <span class="rt">${esc(e.right)}</span><div class="small mute">${esc(e.why||'')}</div></div>`).join('')}
 ${g.better?`<details style="margin-top:10px"><summary style="cursor:pointer;min-height:40px;font-weight:600">Câu trả lời mẫu B2 từ ý của anh</summary><div class="prompt">${paras(g.better)}</div><button id="sbetter" style="margin-top:8px">🔊 Nghe bản mẫu</button></details>`:''}`}
document.addEventListener('click',e=>{if(e.target.id==='sbetter'){const p=e.target.previousElementSibling.innerText;speakLines(p.split(/\n+/).filter(Boolean).map(t=>({sp:'',t}))).catch(()=>{})}});

function Mock(){const p=param;const sel=+(p.test||3);

  <div class="row">${testSel('mt',sel)}<button class="red" id="mgo">Bắt đầu thi thử</button></div><p class="small mute">Khoảng 3 giờ 15 phút. Lịch gợi ý: Test 3 ngày 28/11, Test 6 ngày 02/12. Không rời trang giữa chừng – điểm từng phần chỉ lưu khi hoàn thành.</p></div>`;
  $('#mgo').onclick=()=>runMock(+$('#mt').value)}
async function runMock(test){const res={test};
  const step=(fn,opts)=>new Promise(r=>fn({...opts,test,exam:true,onDone:r}));
  res.L=await step(listeningView,{part:'all'});await gate('Xong phần Nghe','Tiếp: Đọc 60 phút.');
  res.R=await step(readingView,{pass:'all'});await gate('Xong phần Đọc','Tiếp: Viết 60 phút – Task 2 (40\') trước, rồi Task 1 (20\').');
  const wEnd=Date.now()+60*60e3;const wbar=()=>{clearTimers();const el=document.createElement('div');el.className='card row';el.style.justifyContent='space-between';el.innerHTML='<b>Thời gian Viết còn lại (cả 2 task)</b><span class="timer" id="mwt"></span>';$('#app').prepend(el);timer($('#mwt'),Math.max(0,Math.round((wEnd-Date.now())/1000)),()=>{$('#wsub')&&$('#wsub').click()})};
  res.W2=await new Promise(r=>{writingView({test,task:2,mode:'full',exam:true,onDone:r});wbar()});
  res.W1=await new Promise(r=>{writingView({test,task:1,mode:'full',exam:true,onDone:r});wbar()});clearTimers();
  await gate('Xong phần Viết','Tiếp: Nói – Part 1 (3\'), Part 2 (1\' chuẩn bị + 2\'), Part 3 (1\' + 4\').');
  res.S=[];for(const part of [1,2,3]){res.S.push({part,...await step(speakingView,{part})})}
  mockReport(res)}
function gate(title,next){return new Promise(r=>{clearTimers();$('#app').innerHTML=`<div class="card"><h1>${esc(title)}</h1><p>${esc(next)}</p><button class="pri" id="gnext">Tiếp tục</button></div>`;$('#gnext').onclick=r;scrollTo(0,0)})}
async function mockReport(res){const t=T[res.test-1];
  $('#app').innerHTML=`<div class="card"><h1>Kết quả thi thử · Test ${res.test}</h1><p class="loading" id="mload">Claude đang chấm Viết và Nói (khoảng 1–2 phút)…</p><div id="mout"></div></div>`;
  const gw=async(task,text)=>{if(words(text)<20)return {band:0,summary:'Không có bài làm.',errors:[]};return askJSON(`You are a strict, experienced VSTEP writing examiner. ${W_RULES}\nTASK ${task} PROMPT:\n${(task===1?t.writing.task1:t.writing.task2).replace(/\*/g,'')}\n\nRESPONSE (${words(text)} words; minimum ${task===1?120:250}):\n"""${text}"""\nReturn JSON only, Vietnamese feedback: {"tf":n,"org":n,"voc":n,"gra":n,"band":n,"summary":"2 câu","priorities":["3 việc"],"errors":[{"wrong":"exact substring","right":"corrected","type":"ngữ pháp|chính tả|từ vựng|cấu trúc câu|mạch lạc|đáp ứng đề","why":"tiếng Việt"}] (up to 12),"improved":"corrected B2 version of their text"}`,'complex')};
  let g1,g2,gs=[];const errs=[];
  try{[g2,g1]=await Promise.all([gw(2,res.W2.text||''),gw(1,res.W1.text||'')]);
    gs=await Promise.all(res.S.map(s=>words(s.text)<10?{band:0,summary:'Không có nội dung.',errors:[]}:gradeSpeaking(s.part,s.qText,s.text)))}catch(e){$('#mload').outerHTML=errBox(e)}
  const W=g1&&g2?r05((+g1.band+2*+g2.band)/3):null,S=gs.length===3?r05(gs.reduce((a,g)=>a+ +g.band,0)/3):null;
  const L=res.L.score,R=res.R.score,sum=[L,R,W,S].every(x=>x!=null)?L+R+W+S:null,ov=sum!=null?r05(sum/4):null;
  $('#mload')?.remove();
  $('#mout').innerHTML=`<div class="grid4" style="margin:12px 0">${[['Nghe',L,`${res.L.right}/35`],['Đọc',R,`${res.R.right}/40`],['Viết',W,'Task 1 ×1, Task 2 ×2'],['Nói',S,'TB 3 phần']].map(([n,v,s])=>`<div class="card" style="margin:0;padding:12px"><div class="small mute">${n}</div><div style="font-size:30px;font-weight:800">${v!=null?v.toFixed(1):'–'}</div><div class="small mute">${s}</div></div>`).join('')}</div>
   ${ov!=null?`<div class="${ov>=6?'note':'bad-note'}" style="font-size:18px"><b>Tổng ${sum.toFixed(1)} → trung bình ${(sum/4).toFixed(2)} → ${ov.toFixed(1)} · ${level(ov)}</b>${ov<6?` · còn thiếu ${(23-sum).toFixed(1)} điểm tổng`:''}</div>`:''}
   ${g2?`<h2 style="margin-top:20px">Viết Task 2</h2>${gradeBlock(g2,true)}`:''}${g1?`<h2 style="margin-top:20px">Viết Task 1</h2>${gradeBlock(g1,true)}`:''}
   ${gs.map((g,i)=>`<h2 style="margin-top:20px">Nói Part ${i+1}</h2>${speakBlock(g)}`).join('')}
   <div class="row" style="margin-top:16px"><button class="pri" id="msave">Lưu tất cả lỗi vào Sổ lỗi</button><a class="btn" href="#home" style="display:inline-flex;align-items:center;text-decoration:none">Về Tổng quan</a></div>`;
  $('#msave').onclick=()=>{let n=0;if(g2)n+=addErrors(g2.errors,'W',`Thi thử T${res.test} Task 2`);if(g1)n+=addErrors(g1.errors,'W',`Thi thử T${res.test} Task 1`);gs.forEach((g,i)=>n+=addErrors(g.errors,'S',`Thi thử T${res.test} Part ${i+1}`));$('#msave').textContent=`Đã lưu ${n} lỗi`;$('#msave').disabled=true};
  if(W!=null)addAttempt({skill:'W',label:`Thi thử T${res.test} – Viết`,score:W});if(S!=null)addAttempt({skill:'S',label:`Thi thử T${res.test} – Nói`,score:S});
  addAttempt({skill:'MOCK',label:`Thi thử T${res.test} – Tổng`,score:ov,detail:{L,R,W,S}});
}

/* ---------- ERROR BOOK ---------- */
const SPELL=['environment','government','necessary','advantage','disadvantage','beneficial','convenient','technology','opportunity','development','knowledge','achieve','believe','receive','recommend','accommodation','responsible','successful','communicate','especially','definitely','separate','business','interesting','pollution','transportation','traditional','experience','their','which'];
function Errors(){const E=store.errors,open=E.filter(e=>e.ok<2);const types={};E.forEach(e=>types[e.type||'khác']=(types[e.type||'khác']||0)+1);
  $('#app').innerHTML=`<div class="card"><h1>Sổ lỗi</h1><p class="mute">${E.length} lỗi đã lưu · ${open.length} lỗi chưa thuộc (gõ đúng 2 lần là thuộc).</p>
  <div class="row">${Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="tag r">${esc(k)}: ${v}</span>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="red" id="edrill" ${open.length?'':'disabled'}>Drill sửa câu (${Math.min(open.length,5)} câu)</button><button class="pri" id="sdrill">Drill chính tả (10 từ)</button></div></div>
  <div class="card" id="drill" style="display:none"></div>
  <div class="card"><h2>Tất cả lỗi</h2>${E.length?`<table class="stack"><thead><tr><th>Sai</th><th>Đúng</th><th>Loại</th><th>Nguồn</th></tr></thead><tbody>${E.slice().reverse().map(e=>`<tr><td><s style="color:var(--red)">${esc(e.wrong)}</s></td><td><b>${esc(e.right)}</b><div class="small mute">${esc(e.why)}</div></td><td>${esc(e.type)}${e.ok>=2?' <span class="tag g">thuộc</span>':''}</td><td class="small mute">${esc(e.src)}</td></tr>`).join('')}</tbody></table>`:'<p class="mute">Chưa có lỗi nào. Sau mỗi lần chấm Viết/Nói, bấm "Lưu lỗi".</p>'}</div>`;
  $('#edrill').onclick=()=>drillSent(open.sort(()=>Math.random()-.5).slice(0,5),0,0);
  $('#sdrill').onclick=()=>{const own=E.filter(e=>e.type==='chính tả'&&/^[A-Za-z'-]+$/.test(e.right)).map(e=>e.right);drillSpell([...new Set([...own,...SPELL])].sort(()=>Math.random()-.5).slice(0,10),0,0)}}
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function drillSent(list,i,score){const d=$('#drill');d.style.display='block';if(i>=list.length){d.innerHTML=`<h2>Xong: ${score}/${list.length} câu đúng</h2><button id="dend">Đóng</button>`;$('#dend').onclick=Errors;persist();return}
  const e=list[i];d.innerHTML=`<h2>Câu ${i+1}/${list.length}</h2><p>Gõ lại cho đúng:</p><p class="prompt" style="color:var(--red)">${esc(e.wrong)}</p><p class="small mute">Gợi ý: lỗi ${esc(e.type)}</p><input type="text" id="din" style="width:100%" spellcheck="false" autocomplete="off" autocapitalize="off"><div class="row" style="margin-top:10px"><button class="pri" id="dchk">Kiểm tra</button></div><div id="dres"></div>`;
  $('#din').focus();const chk=()=>{const ok=norm($('#din').value)===norm(e.right);const rec=store.errors.find(x=>x.id===e.id);if(rec){rec.ok=ok?rec.ok+1:0;persist()}
    $('#dres').innerHTML=`<p class="${ok?'note':'bad-note'}">${ok?'Đúng!':'Chưa đúng.'} Đáp án: <b>${esc(e.right)}</b><br><span class="small">${esc(e.why)}</span></p><button id="dnext" class="pri">Tiếp →</button>`;$('#dchk').disabled=true;$('#dnext').onclick=()=>drillSent(list,i+1,score+(ok?1:0));$('#dnext').focus()};
  $('#dchk').onclick=chk;$('#din').onkeydown=ev=>{if(ev.key==='Enter')chk()}}
function drillSpell(list,i,score){const d=$('#drill');d.style.display='block';if(i>=list.length){d.innerHTML=`<h2>Chính tả: ${score}/${list.length}</h2><button id="dend">Đóng</button>`;$('#dend').onclick=Errors;return}
  const w=list[i];d.innerHTML=`<h2>Từ ${i+1}/${list.length}</h2><p>Bấm nghe rồi gõ từ. ${cap.tts||'speechSynthesis' in window?'':'(Trình duyệt không đọc được – từ hiện mờ 1 giây.)'}</p><div class="row"><button id="dsay">🔊 Nghe từ</button><span id="dpeek" class="mute"></span></div><input type="text" id="din" style="width:100%;margin-top:10px" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"><div class="row" style="margin-top:10px"><button class="pri" id="dchk">Kiểm tra</button></div><div id="dres"></div>`;
  const say=()=>speakLines([{sp:'',t:w}],.8).catch(()=>{$('#dpeek').textContent=w;setTimeout(()=>$('#dpeek').textContent='',1000)});$('#dsay').onclick=say;say();$('#din').focus();
  const chk=()=>{const ok=$('#din').value.trim().toLowerCase()===w.toLowerCase();$('#dres').innerHTML=`<p class="${ok?'note':'bad-note'}">${ok?'Đúng!':'Sai.'} <b style="font-size:20px;letter-spacing:.04em">${esc(w)}</b></p><button id="dnext" class="pri">Tiếp →</button>`;$('#dchk').disabled=true;$('#dnext').onclick=()=>drillSpell(list,i+1,score+(ok?1:0));$('#dnext').focus()};
  $('#dchk').onclick=chk;$('#din').onkeydown=ev=>{if(ev.key==='Enter')chk()}}

/* ---------- boot ---------- */
async function boot(){lsLoad();
  cap={sample:true,tts:null,dictation:makeDictation()};
  if(cap.dictation){cap.dictation.onFinal(({text})=>DICT.final&&DICT.final(text));cap.dictation.onState(({state})=>DICT.state&&DICT.state(state))}
  try{const am=await fetch('audio/index.json');if(am.ok)AUDIO=new Set(await am.json())}catch(e){}
  try{T=await (await fetch('data/tests.json')).json()}catch(e){$('#app').innerHTML='<p class="bad-note">Không tải được bộ đề.</p>';return}
  render();
}
boot();
}
</script>
