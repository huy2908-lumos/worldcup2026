<style>

   PICTURE: phễu "Hành trình sang Nhật" khổ lớn trên dải chàm, chặng cuối là mặt trời đỏ son.
   COLOUR/TYPE: trắng + mực đen, chàm #23308f chủ đạo, đỏ son #d93a2b nhấn; Be Vietnam Pro (đủ dấu tiếng Việt).

:root{color-scheme:light dark;

--shu:light-dark(#d93a2b,#ff6d5e);

.brand{line-height:1.15}.brand b{display:block;font-size:15px}.brand span{font-size:12.5px;color:var(--mut)}

<body>

<script>
/* ===== P2 ENGINE: field model, flexible import, matching, KPIs ===== */
const P2 = (() => {
  const strip = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
  const key = s => strip(s).toLowerCase().replace(/[\n\r]+/g, ' ').replace(/[^a-z0-9()&/+ -]/g, ' ').replace(/\s+/g, ' ').trim();
  const TN_OPTS = ['Đạt', 'Nợ', 'Đang học', 'Đăng ký', 'Dừng'];
  const PROG_OPTS = ['Hoàn thành', 'Vượt Tiến độ', 'Đúng tiến độ', 'Nợ 1 TN', 'Nợ 2 TN', 'Nợ 3 TN', 'Nợ 4 TN', 'Nợ 5 TN', 'Nợ 6 TN', 'Nợ 7 TN', 'Dừng'];
  const PY_OPTS = ['KS', 'TTS', 'NP', 'KNDD', 'NSCC', 'Chưa chuyển PY', 'Công ty ngoài', 'Dừng'];
  // f: field id, l: label, g: group, pii: editors-only, syn: header synonyms (normalized)
  const FIELDS = [
    { f: 'name', l: 'Họ và tên', g: 'info', syn: ['ho va ten', 'ho ten', 'ho & ten', 'ho va ten hoc vien', 'ho va ten sinh vien', 'ten hoc vien', 'ten sinh vien', 'full name', 'name', 'ho ten sv', 'ho ten hv'] },
    { f: 'ten', l: 'Tên (gọi)', g: 'info', syn: ['ten'] },
    { f: 'dob', l: 'Ngày sinh', g: 'info', syn: ['nam sinh', 'ngay sinh', 'ngay thang nam sinh', 'dob', 'birthday', 'date of birth', 'sinh ngay'] },
    { f: 'mssv', l: 'MSSV', g: 'info', syn: ['mssv', 'ma so sinh vien', 'ma sv', 'ma sinh vien', 'student id', 'ma hoc vien', 'ma hv'] },
    { f: 'major', l: 'Chuyên ngành', g: 'info', syn: ['chuyen nganh', 'nganh', 'nganh hoc', 'major', 'nganh dao tao'] },
    { f: 'ms', l: 'MS phụ trách', g: 'info', syn: ['ms', 'ms no.', 'tu van vien', 'nhan vien tu van', 'ms phu trach', 'nguoi phu trach'] },
    { f: 'phone', l: 'Số điện thoại', g: 'info', pii: 1, syn: ['so dien thoai', 'dien thoai', 'sdt', 'so dt', 'dt', 'phone', 'mobile', 'zalo', 'sdt/zalo', 'so dien thoai/zalo', 'dien thoai lien he'] },
    { f: 'cccd', l: 'CCCD', g: 'info', pii: 1, syn: ['cccd', 'cmnd', 'cmnd/cccd', 'cccd/cmnd', 'can cuoc', 'can cuoc cong dan', 'so cccd', 'so cmnd', 'so dinh danh', 'id card'] },
    { f: 'addr', l: 'Địa chỉ / Quê quán', g: 'info', pii: 1, syn: ['dia chi', 'que quan', 'noi o', 'address', 'tinh', 'tinh/thanh', 'dia chi thuong tru', 'ho khau'] },
    ...[1, 2, 3, 4, 5, 6, 7, 8].map(i => ({ f: 'tn' + i, l: 'TN' + i, g: 'tn', opts: TN_OPTS, syn: ['tn' + i, 'tieng nhat ' + i, 'hp' + i, 'tn ' + i] })),
    { f: 'n5', l: 'Đánh giá N5', g: 'tn', syn: ['danh gia n5'] },
    { f: 'prog', l: 'Kết quả tiến độ', g: 'tn', opts: PROG_OPTS, syn: ['tien do', 'tien do hoc', 'ket qua tien do', 'hien trang hoc tap'] },
    { f: 'gv', l: 'Nhận xét của giáo viên', g: 'tn', long: 1, syn: ['nhan xet cua giao vien', 'nhan xet gv', 'nhan xet giao vien', 'y kien gv'] },
    { f: 'ltf', l: 'Luyện thi miễn phí (24 tiết)', g: 'exam', syn: ['luyen thi mien phi (24 tiet)', 'luyen thi mien phi'] },
    { f: 'ltp', l: 'Luyện thi có phí (120 tiết)', g: 'exam', syn: ['luyen thi co phi (120 tiet)', 'luyen thi co phi'] },
    { f: 'jlpt', l: 'ĐK thi JLPT', g: 'exam', syn: ['dk thi jlpt', 'dang ky jlpt', 'jlpt'] },
    { f: 'nat', l: 'ĐK thi NAT-TEST', g: 'exam', syn: ['dk thi nattest', 'dang ky nattest', 'nattest', 'nat test'] },
    { f: 'jpc', l: 'JPC-N4', g: 'exam', syn: ['jpc-n4', 'jpc n4'] },
    { f: 'n4', l: 'Kết quả tiếng Nhật (N4)', g: 'exam', syn: ['ket qua tieng nhat', 'kq tieng nhat', 'kq n4', 'ket qua n4', 'chung chi'] },
    { f: 'nomon', l: 'Nợ môn', g: 'grad', syn: ['no mon'] },
    { f: 'htmon', l: 'Hoàn tất môn', g: 'grad', syn: ['hoan tat mon'] },
    { f: 'dktn', l: 'Dự kiến tốt nghiệp', g: 'grad', syn: ['du kien tot nghiep', 'du kien tn', 'nam tot nghiep'] },
    { f: 'sv', l: 'Kế hoạch sơ vấn (Webinar)', g: 'job', syn: ['ke hoach so van (webinar)', 'ke hoach so van', 'so van'] },
    { f: 'tv', l: 'Kết quả tư vấn định hướng', g: 'job', syn: ['ket qua tu van dinh huong (webinar)', 'ket qua tu van dinh huong', 'tu van dinh huong'] },
    { f: 'py', l: 'Chương trình việc làm (PY)', g: 'job', opts: PY_OPTS, syn: ['chuyen doi chuong trinh viec lam (py)', 'chuyen doi chuong trinh', 'chuong trinh (py)', 'py', 'chuong trinh'] },
    { f: 'kg', l: 'Tiến độ khai giảng', g: 'job', syn: ['tien do khai giang', 'khai giang'] },
    { f: 'ctydk', l: 'Công ty ĐK phỏng vấn', g: 'job', syn: ['cong ty dk phong van', 'cong ty dang ky phong van'] },
    { f: 'tdpv', l: 'Tiến độ PV', g: 'job', syn: ['tien do pv', 'tien do phong van', 'ngay phong van'] },
    { f: 'ctypv', l: 'Công ty đậu PV', g: 'job', syn: ['cong ty dau phong van', 'cong ty dau pv', 'cong ty trung tuyen'] },
    { f: 'xc', l: 'Thời gian xuất cảnh', g: 'job', date: 1, syn: ['thoi gian xuat canh', 'ngay xuat canh', 'xuat canh'] },
    { f: 'iq', l: 'Bài IQ', g: 'st', pii: 1, syn: ['bai iq', 'iq'] },
    { f: 'timchu', l: 'Tìm chữ', g: 'st', pii: 1, syn: ['tim chu'] },
    { f: 'tinhnhanh', l: 'Tính nhanh', g: 'st', pii: 1, syn: ['tinh nhanh'] },
    { f: 'kqst', l: 'Kết quả sơ tuyển', g: 'st', pii: 1, syn: ['ket qua so tuyen'] },
    { f: 'kqlai', l: 'Kết quả test lại', g: 'st', pii: 1, syn: ['ket qua test lai'] },
    { f: 'kham', l: 'Khám sức khỏe', g: 'st', pii: 1, syn: ['kham', 'kham suc khoe'] },
    { f: 'kqkham', l: 'Kết quả khám', g: 'st', pii: 1, syn: ['ket qua kham'] },
    { f: 'nopdu', l: 'Đã nộp đủ hồ sơ', g: 'st', pii: 1, syn: ['da nop du', 'nop du ho so'] },
    { f: 'msnote', l: 'Nhận xét của MS', g: 'note', pii: 1, long: 1, syn: ['nhan xet cua ms ve ung vien', 'nhan xet cua ms', 'nhan xet ms', 'y kien ms', 'ghi chu tu van'] },
    { f: 'idc', l: 'ID Contact', g: 'note', syn: ['id contac', 'id contact', 'contact id'] }
  ];
  const BY = Object.fromEntries(FIELDS.map(x => [x.f, x]));
  const PII = new Set(FIELDS.filter(x => x.pii).map(x => x.f));
  const DATEISH = new Set(['dob', 'dktn', 'xc', 'kg', 'tdpv', 'sv', 'htmon']);

  const pad = n => String(n).padStart(2, '0');
  function serialToYMD(n) { const d = new Date(Math.round((n - 25569) * 864e5)); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() }; }
  function cellVal(v, f) {
    if (v === null || v === undefined) return '';
    if (v === 0 && (f === 'dob' || f === 'xc' || f === 'dktn')) return '';
    if (v instanceof Date) v = v.getTime() / 864e5 + 25569;
    if (typeof v === 'number') {
      if (DATEISH.has(f) && v > 15000 && v < 80000) {
        const t = serialToYMD(v);
        if (f === 'dob') return `${pad(t.d)}/${pad(t.m)}/${t.y}`;
        if (f === 'dktn') return `T${pad(t.m)}/${t.y}`;
        return `${t.y}-${pad(t.m)}-${pad(t.d)}`;
      }
      if (Number.isInteger(v)) v = String(v); else v = String(+v.toFixed(4));
    }
    let s = String(v).replace(/\r\n?/g, '\n').replace(/[ \t ]+/g, ' ').trim();
    if (f === 'dktn') s = s.replace(/\s+/g, '');
    if (f === 'cccd' && /^\d{9,11}$/.test(s)) s = s.padStart(12, '0');
    if (f === 'phone' && /^\d{9}$/.test(s)) s = '0' + s;
    return s;
  }

  /* --- header detection & auto-mapping --- */
  function guessField(h, used) {
    const k = key(h); if (!k) return '';
    for (const x of FIELDS) if (!used.has(x.f) && x.syn.includes(k)) return x.f;
    if (k === 'ket qua') return !used.has('prog') ? 'prog' : (!used.has('n4') ? 'n4' : '');
    for (const x of FIELDS) if (!used.has(x.f) && x.syn.some(s => s.length > 3 && (k.startsWith(s) || k.includes(s)))) return x.f;
    return '';
  }
  function detectHeader(rows) {
    let best = -1, score = 0;
    for (let r = 0; r < Math.min(rows.length, 20); r++) {
      const used = new Set(); let sc = 0;
      for (const c of rows[r] || []) { const g = guessField(c, used); if (g) { used.add(g); sc += g === 'name' ? 3 : 1; } }
      if (sc > score) { score = sc; best = r; }
    }
    return score >= 3 ? best : 0;
  }
  function autoMap(header) {
    const used = new Set();
    return header.map(h => { const g = guessField(h, used); if (g) used.add(g); return g; });
  }
  function fullName(r) {
    const n = (r.name || '').trim(), t = (r.ten || '').trim();
    if (!t) return n;
    const nk = key(n).split(' '), tk = key(t);
    return nk[nk.length - 1] === tk ? n : (n + ' ' + t).trim();
  }
  function rowsToRecords(rows, hdrRow, map) {
    const out = [];
    for (let r = hdrRow + 1; r < rows.length; r++) {
      const row = rows[r] || []; const rec = {};
      map.forEach((f, i) => { if (!f) return; const v = cellVal(row[i], f); if (v !== '' && rec[f] === undefined) rec[f] = v; });
      if (!rec.name || !key(rec.name)) continue;
      if (/^(tong cong|total|grand total)\b/.test(key(rec.name))) continue;
      rec.name = fullName(rec); rec._row = r + 1;
      out.push(rec);
    }
    return out;
  }

  /* --- identity normalizers --- */
  const nName = s => key(s).replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
  const nPhone = s => { let d = String(s || '').replace(/\D/g, ''); if (d.startsWith('84') && d.length >= 11) d = '0' + d.slice(2); return d.length >= 9 ? d.slice(-9) : ''; };
  const nCCCD = s => { const d = String(s || '').replace(/\D/g, '').replace(/^0+/, ''); return d.length >= 8 ? d : ''; };
  const nMSSV = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  function nDob(s) {
    s = String(s || '').trim(); let m;
    if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/))) return `${pad(m[1])}/${pad(m[2])}/${m[3]}`;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[3]}/${m[2]}/${m[1]}`;
    if ((m = s.match(/^(\d{4})$/))) return m[1];
    return '';
  }
  function buildIndex(list) { // list of {id,k,name,dob,mssv,phone,cccd}
    const ix = { phone: new Map(), cccd: new Map(), mssv: new Map(), name: new Map() };
    const add = (m, k, v) => { if (!k) return; if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
    for (const s of list) { add(ix.phone, nPhone(s.phone), s); add(ix.cccd, nCCCD(s.cccd), s); add(ix.mssv, nMSSV(s.mssv), s); add(ix.name, nName(s.name), s); }
    return ix;
  }
  // returns {level:'dup'|'maybe'|'new', hits:[{s, why:[...]}]}
  function matchOne(rec, ix) {
    const hits = new Map();
    const hit = (s, why) => { if (!hits.has(s.id)) hits.set(s.id, { s, why: [] }); const h = hits.get(s.id); if (!h.why.includes(why)) h.why.push(why); };
    for (const s of ix.cccd.get(nCCCD(rec.cccd)) || []) hit(s, 'CCCD');
    for (const s of ix.phone.get(nPhone(rec.phone)) || []) hit(s, 'SĐT');
    for (const s of ix.mssv.get(nMSSV(rec.mssv)) || []) hit(s, !rec.name || !s.name || nName(rec.name) === nName(s.name) ? 'MSSV' : 'Trùng MSSV (khác họ tên)');
    const d1 = nDob(rec.dob);
    for (const s of ix.name.get(nName(rec.name)) || []) {
      const d2 = nDob(s.dob);
      if (d1 && d2 && d1.slice(-4) === d2.slice(-4) && (d1.length === 4 || d2.length === 4 || d1 === d2)) hit(s, 'Họ tên + Ngày sinh');
      else if (d1 && d2 && d1 !== d2) hit(s, 'Trùng họ tên (khác ngày sinh)');
      else hit(s, 'Họ tên');
    }
    const arr = [...hits.values()];
    const strong = h => h.why.some(w => ['CCCD', 'SĐT', 'MSSV', 'Họ tên + Ngày sinh'].includes(w));
    arr.sort((a, b) => strong(b) - strong(a) || b.why.length - a.why.length);
    const soft = arr.filter(h => !(h.why.length === 1 && h.why[0].startsWith('Trùng họ tên (khác')));
    return { level: arr.some(strong) ? 'dup' : soft.length ? 'maybe' : 'new', hits: arr };
  }

  /* --- KPIs (mirrors DB_Engine of the source workbook) --- */
  const PYSET = new Set(['KS', 'TTS', 'NP', 'KNDD', 'NSCC']);
  const isDrop = s => s.prog === 'Dừng';
  const isPV = s => { const c = (s.ctypv || '').trim(); return c && c !== 'Dừng' && c !== '0' && !c.startsWith('Chưa') && !c.startsWith('Công ty'); };
  const isXC = (s, today) => /^\d{4}-\d\d-\d\d$/.test(s.xc || '') && s.xc <= today;
  const hasN4 = s => /N4/i.test(s.n4 || '');
  const tnPass = (s, i) => s['tn' + i] === 'Đạt';
  function gradYear(s) {
    const d = s.dktn || ''; if (!d) { const n = parseInt(String(s.k || '').replace(/\D/g, '')); return n ? n + 1979 : 0; }
    const m = d.match(/(\d{4})$/); return m ? +m[1] : 0;
  }
  function kpis(list, today) {
    today = today || new Date().toISOString().slice(0, 10);
    const yr = +today.slice(0, 4);
    const c = f => list.reduce((a, s) => a + (f(s) ? 1 : 0), 0);
    const tot = list.length, drop = c(isDrop), act = tot - drop;
    const ht = c(s => (s.prog || '').startsWith('Hoàn thành')), vuot = c(s => (s.prog || '').startsWith('Vượt')), dung = c(s => (s.prog || '').startsWith('Đúng')), no = c(s => (s.prog || '').startsWith('Nợ'));
    const n4 = c(hasN4), py = c(s => PYSET.has(s.py)), chua = c(s => (s.py || '').startsWith('Chưa')), ngoai = c(s => (s.py || '').startsWith('Công ty'));
    const pv = c(isPV), xc = c(s => isXC(s, today)), jlpt = c(s => /^JLPT/.test(s.jlpt || '') || s.jlpt === 'ĐẠT');
    const due = list.filter(s => !isDrop(s) && s.dktn !== 'Dừng' && gradYear(s) > 0 && gradYear(s) <= yr);
    const grad = due.filter(s => hasN4(s) || ['TTS', 'KS', 'KNDD', 'NP'].includes(s.py) || (s.py || '').startsWith('Công ty')).length;
    const gradL = due.filter(s => hasN4(s) || ['TTS', 'KS', 'KNDD', 'NP'].includes(s.py) || (s.py || '').startsWith('Công ty'));
    const n4due = due.filter(hasN4).length, pytn = gradL.filter(s => PYSET.has(s.py)).length, xctn = gradL.filter(s => isXC(s, today)).length;
    const tn = [1, 2, 3, 4, 5, 6, 7, 8].map(i => c(s => tnPass(s, i)));
    const avgTN = tot ? list.reduce((a, s) => a + [1, 2, 3, 4, 5, 6, 7, 8].filter(i => tnPass(s, i)).length, 0) / tot : 0;
    const mix = { KS: c(s => s.py === 'KS'), 'TTS/NP': c(s => s.py === 'TTS' || s.py === 'NP'), KNDD: c(s => s.py === 'KNDD'), NSCC: c(s => s.py === 'NSCC') };
    return { n4due, pytn, xctn, avgTN, tot, drop, act, ht, vuot, dung, no, n4, py, chua, ngoai, pv, xc, jlpt, due: due.length, grad, tn, mix,
      dropP: tot ? drop / tot : 0, goodP: act ? (ht + vuot + dung) / act : 0, n4P: act ? n4 / act : 0, pyP: act ? py / act : 0,
      pvP: py ? pv / py : 0, xcP: pv ? xc / pv : 0, gradP: due.length ? grad / due.length : 0, other: tot - drop - ht - vuot - dung - no };
  }
  const MAJORS = [['Ô tô', /o to/], ['Cơ khí', /co khi|che tao may/], ['Điện - Điện tử', /dien/], ['ĐK & TĐH', /dieu khien|tu dong|tdh/], ['Thực phẩm', /thuc pham/], ['Sinh học', /sinh hoc/], ['CTXD', /xay dung|ctxd/]];
  const majorGroup = m => { const k = key(m); for (const [n, re] of MAJORS) if (re.test(k)) return n; return k ? 'Khác' : 'Chưa rõ'; };

  return { FIELDS, BY, PII, TN_OPTS, PROG_OPTS, PY_OPTS, key, strip, cellVal, detectHeader, autoMap, rowsToRecords, fullName,
    nName, nPhone, nCCCD, nMSSV, nDob, buildIndex, matchOne, kpis, majorGroup, isDrop, isPV, isXC, hasN4, gradYear, MAJORS: MAJORS.map(m => m[0]).concat(['Khác']) };
})();


</script>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (x, d = 1) => (x * 100).toFixed(d).replace('.', ',') + '%';
const fmtD = s => { const m = String(s || '').match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ''); };
const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
const F = P2.FIELDS, BY = P2.BY;
const S = { db: null, user: null, me: '', canWrite: false, admin: false, owner: false, ready: false, err: '',
  cfg: null, roster: {}, pii: {}, list: [], search: { q: '', f: {}, preset: '', limit: 100 },
  course: '', cTab: 'ds', cq: '', dirty: {}, imp: null, names: {}, dk: '', extra: {}, lists: {}, lt: '', lq: '', openMs: '' };
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }

/* ---------- data model ---------- */
function courses() {
  const fromCfg = (S.cfg && S.cfg.list) || [];
  const ks = new Set(fromCfg.map(c => c.k));
  const extra = Object.keys(S.roster).filter(k => !ks.has(k)).map(k => ({ k }));
  return [...fromCfg, ...extra].filter(c => !c.hidden).sort((a, b) => String(a.k).localeCompare(String(b.k), 'vi', { numeric: true }));
}
const cLabel = k => { const c = ((S.cfg && S.cfg.list) || []).find(x => x.k === k); return c && c.label ? c.label : 'Khóa ' + String(k).replace(/^K/, ''); };
function rebuild() {
  const out = [];
  for (const [k, doc] of Object.entries(S.roster)) {
    const s = (doc && doc.s) || {}; const p = (S.pii[k] && S.pii[k].s) || {};
    for (const [id, r] of Object.entries(s)) { if (!r || r.del) continue; out.push({ ...r, ...(p[id] || {}), id, k }); }
  }
  out.sort((a, b) => String(a.k).localeCompare(String(b.k), 'vi', { numeric: true }) || P2.nName(a.name).split(' ').pop().localeCompare(P2.nName(b.name).split(' ').pop()) || String(a.name).localeCompare(String(b.name), 'vi'));
  S.list = out;
}
const tnCount = s => [1, 2, 3, 4, 5, 6, 7, 8].filter(i => s['tn' + i] === 'Đạt').length;
function progChip(p) {
  p = p || ''; if (!p) return '<span class="chip">—</span>';
  const c = p.startsWith('Hoàn') ? 'c-ok' : p.startsWith('Vượt') ? 'c-ai' : p.startsWith('Đúng') ? 'c-ai' : p.startsWith('Nợ') ? 'c-warn' : p === 'Dừng' ? 'c-bad' : '';
  return `<span class="chip ${c}">${esc(p)}</span>`;
}

/* ---------- writes ---------- */
const queues = {};
function enqueue(path, fn) { const p = (queues[path] || Promise.resolve()).catch(() => {}).then(fn); queues[path] = p; return p; }
async function patchDoc(col, k, map) { // map: {id:{...fields}}
  if (!Object.keys(map).length) return;
  const ref = S.db.doc(col + '/' + k);
  return enqueue(col + '/' + k, async () => {
    const snap = await ref.get();
    if (snap.exists) await ref.update({ s: map });
    else await ref.set({ s: map });
  });
}
function split(rec) { const pub = {}, pv = {}; for (const [f, v] of Object.entries(rec)) { if (f === 'diem') { pub.diem = v; continue; } if (!BY[f]) continue; (P2.PII.has(f) ? pv : pub)[f] = v ?? ''; } return [pub, pv]; }
async function saveMany(byCourse) { // {k:{id:rec}}
  for (const [k, m] of Object.entries(byCourse)) {
    const pubs = {}, pvs = {};
    for (const [id, rec] of Object.entries(m)) { const [a, b] = split(rec); if (rec.del) a.del = 1; pubs[id] = { ...a, u: new Date().toISOString(), ub: S.me || '' }; if (Object.keys(b).length) pvs[id] = b; }
    await patchDoc('roster', k, pubs);
    if (Object.keys(pvs).length) await patchDoc('pii', k, pvs);
  }
}
function writeErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument' && /256|size|large|deep/i.test(e.message || '')) return 'Khóa này quá nhiều dữ liệu cho một lần ghi – hãy chia nhỏ file.';
  if (c === 'invalid_argument') { S.canWrite = false; render(); return 'Tài khoản này chỉ có quyền xem – không thể ghi dữ liệu.'; }
  if (c === 'quota_exceeded') return 'Kho dữ liệu đã đầy: ' + (e.message || '');
  if (c === 'resource_exhausted') return 'Ghi quá nhanh, vui lòng thử lại sau vài giây.';
  return 'Không ghi được dữ liệu (' + (c || 'lỗi') + '). Vui lòng thử lại.';
}

/* ---------- BỘ LỌC DÙNG CHUNG (Dashboard · Theo khóa · Tra cứu · Danh sách khác) ---------- */
function fst(ctx) { if (ctx === 'tc') return S.search; S.flt = S.flt || {}; return S.flt[ctx] = S.flt[ctx] || { q: '', f: {} }; }
const fActive = st => !!(st.q || st.preset || Object.values(st.f || {}).some(a => a && a.length));
function msBox(ctx, key, label, opts, sel) {
  const id = ctx + ':' + key;
  return `<details class="ms" data-mskey="${esc(id)}" ${S.openMs === id ? 'open' : ''}><summary><span class="ml">${esc(label)}</span><b>${sel.length ? esc(sel.length > 1 ? sel.length + ' mục' : sel[0]) : 'Tất cả'}</b></summary><div class="msl">${sel.length ? `<button class="lnk" data-msclr="${esc(key)}" data-msctx="${ctx}">Bỏ chọn tất cả</button>` : ''}${opts.map(([v, n]) => `<label><input type="checkbox" data-msf="${esc(key)}" data-msctx="${ctx}" value="${esc(v)}" ${sel.includes(v) ? 'checked' : ''}> <span>${esc(v)}</span><i>${n}</i></label>`).join('')}</div></details>`;
}
// defs: [[key,label]]; optFn(key) -> [[value,count]]
function filterBar(ctx, defs, optFn, shown, total, unit, ph) {
  const st = fst(ctx); st.f = st.f || {};
  return `<div class="fbar"><div class="srch sm"><span>🔍</span><input type="search" class="fq" data-fctx="${ctx}" placeholder="${esc(ph || 'Tìm họ tên, MSSV, MS, ngành, công ty… (không cần dấu)')}" value="${esc(st.q)}" aria-label="Tìm kiếm"></div>
  <div class="msrow">${defs.map(([k, l]) => msBox(ctx, k, l, optFn(k), st.f[k] || [])).join('')}<div class="res"><span>KẾT QUẢ LỌC</span><b>${shown} / ${total}</b><span>${unit}</span>${fActive(st) ? `<button class="lnk" data-fclr="${ctx}">Xóa bộ lọc</button>` : ''}</div></div></div>`;
}
function stdRows(list) { return list.map(s => [s, tcRow(s)]); }
function stdOpts(rows) { return key => { const c = {}; rows.forEach(([, r]) => { const v = r[key] || '(trống)'; c[v] = (c[v] || 0) + 1; }); return Object.entries(c).sort((a, b) => key === 'k' ? a[0].localeCompare(b[0], 'vi', { numeric: true }) : b[1] - a[1]); }; }
function applyStd(rows, st, defs) {
  let R = rows;
  for (const [key] of defs) { const sel = (st.f || {})[key] || []; if (sel.length) R = R.filter(([, r]) => sel.includes(r[key] || '(trống)')); }
  if (st.preset && PRESETS[st.preset]) R = R.filter(([s]) => PRESETS[st.preset][1](s));
  const words = P2.key(st.q).split(' ').filter(Boolean);
  if (words.length) R = R.filter(([s, r]) => { const hay = P2.key([r.name, r.mssv, r.cty, r.ms, r.major, r.k, s.dob, s.n4, s.py, s.prog, s.phone, s.cccd].join(' ')); return words.every(w => hay.includes(w)); });
  return R;
}
// raw lists: pick categorical columns automatically
function rawDefs(t) {
  const skip = /^(STT|SỐ THỨ TỰ|HỌ|TÊN|HỌ VÀ TÊN|HỌ TÊN|MSSV|NĂM SINH|NGÀY SINH|ID|ID DEAL|ID CONTAC|MÃ HỌC VIÊN|CV|VIDEO|BẢNG ĐIỂM|CỘT ẨN|MS NO\.)$/;
  const out = [];
  (t.header || []).forEach((h, i) => {
    if (skip.test(h) || /NHẬN XÉT|GHI CHÚ|ĐỊA CHỈ|NƠI THƯỜNG TRÚ|HỘ KHẨU|LINK|MỤC TIÊU/.test(h)) return;
    const vals = (t.rows || []).map(r => r[i] || ''); const d = new Set(vals.filter(Boolean));
    const avg = vals.reduce((a, v) => a + v.length, 0) / Math.max(1, vals.length);
    let lab = h; if (h === 'KẾT QUẢ' && t.header.filter(x => x === 'KẾT QUẢ').length > 1) lab = t.header.slice(0, i).includes('KẾT QUẢ') ? 'KẾT QUẢ TIẾNG NHẬT' : 'KẾT QUẢ TIẾN ĐỘ';
    if (d.size >= 2 && d.size <= 30 && avg < 28 && !vals.some(v => /^https?:/.test(v))) out.push(['c' + i, lab, d.size]);
  });
  const pri = h => /KHÓA|CHUYÊN|MS|KẾT QUẢ|CHƯƠNG TRÌNH|TIẾN ĐỘ|ỨNG TUYỂN|HỆ/.test(h) ? 0 : 1;
  return out.sort((a, b) => pri(a[1]) - pri(b[1])).slice(0, 6).map(([k, l]) => [k, l]);
}

/* ---------- seeding (owner, first open) ---------- */
async function seedIfNeeded() {
  if (!S.owner || S.seeding || Object.keys(S.roster).length || (S.extra && S.extra.meta)) return;
  let seed; try { const r = await fetch('seed.json', { cache: 'no-store' }); if (!r.ok) return; seed = await r.json(); } catch (_) { return; }
  S.seeding = true;
  const jobs = [['cfg/courses', seed.cfg]];
  for (const [k, v] of Object.entries(seed.roster)) jobs.push(['roster/' + k, v]);
  for (const [k, v] of Object.entries(seed.pii)) jobs.push(['pii/' + k, v]);
  for (const [k, v] of Object.entries(seed.extra)) jobs.push(['extra/' + k, v]);
  for (const [k, v] of Object.entries(seed.lists)) jobs.push(['lists/' + k, v]);
  jobs.push(['extra/meta', { ...seed.meta, seededAt: new Date().toISOString() }]);
  const box = document.createElement('div'); box.className = 'seedbox'; document.body.appendChild(box);
  for (let i = 0; i < jobs.length; i++) {
    box.innerHTML = `<b>Đang nạp toàn bộ dữ liệu từ file gốc…</b><div class="prog"><i style="width:${Math.round(i / jobs.length * 100)}%"></i></div><span>${i}/${jobs.length} · ${esc(jobs[i][0])}</span>`;
    for (let t = 0; t < 5; t++) { try { await S.db.doc(jobs[i][0]).set(jobs[i][1]); break; } catch (e) { if (t === 4 || !['resource_exhausted', 'unavailable'].includes(e && e.code)) { box.innerHTML = `<b>Nạp dữ liệu bị gián đoạn</b><span>${esc(writeErr(e))} Tải lại trang để tiếp tục.</span>`; S.seeding = false; return; } await new Promise(r => setTimeout(r, 1500 * (t + 1))); } }
    await new Promise(r => setTimeout(r, 250));
  }
  box.innerHTML = '<b>Đã nạp xong toàn bộ dữ liệu ✔</b>'; setTimeout(() => box.remove(), 2500); S.seeding = false;
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(email) {
  const r = await fetch('data.json', { cache: 'no-store' }); if (!r.ok) throw new Error('nofile');
  const p = await r.json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(email.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  let raw = null;
  for (const w of p.wraps || []) { try { raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.iv) }, kek, b64(w.ct)); break; } catch (_) {} }
  if (!raw) throw new Error('noaccess');
  const dk = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, dk, b64(p.ct));
  const txt = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const d = JSON.parse(txt); d._adminKey = '';
  if (p.admin) { try { const a = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.admin.iv) }, kek, b64(p.admin.ct)); d._adminKey = JSON.parse(new TextDecoder().decode(a)).key || ''; } catch (_) {} }
  return d;
}

  <form id="gForm" autocomplete="on"><div class="fld"><label for="gEmail">Email</label><input type="email" id="gEmail" required autocomplete="email" inputmode="email" value="${esc(email || '')}" placeholder="ten@esuhai.com"></div>
  <label class="rem"><input type="checkbox" id="gRem" checked> Ghi nhớ trên thiết bị này</label>
  ${msg ? `<p class="gerr" role="alert">${esc(msg)}</p>` : ''}<button class="btn pri" type="submit" id="gBtn">Xem báo cáo</button></form></div></section>`;
  $('#gForm').addEventListener('submit', async ev => {
    ev.preventDefault(); const em = $('#gEmail').value.trim().toLowerCase();
    const b = $('#gBtn'); b.disabled = true; b.textContent = 'Đang mở dữ liệu…';
    try { const d = await unlock(em); S.email = em; if ($('#gRem').checked) { try { localStorage.setItem('p2vl2', em); } catch (_) {} } load(d); startLog('login'); }
    catch (er) { gate(er.message === 'noaccess' ? 'Email này chưa được cấp quyền xem. Vui lòng liên hệ anh Huy.' : 'Chưa tải được dữ liệu, vui lòng thử lại.', em); }
  });
  $('#gEmail').focus();
}
function logout() { logEv('logout'); clearInterval(pingT); try { localStorage.removeItem('p2vl2'); localStorage.removeItem('p2vl'); } catch (_) {} S.ready = false; S.list = []; S.email = ''; S.isAdmin = false; S.adminKey = ''; gate('', ''); renderNav(); }
/* ---------- chế độ xem máy tính / điện thoại ---------- */
function setDev(m) { S.dev = m; if (m === 'auto') document.documentElement.removeAttribute('data-dev'); else document.documentElement.dataset.dev = m; try { localStorage.setItem('p2dev', m); } catch (_) {} renderNav(); }
(async () => {
  try { const m = localStorage.getItem('p2dev'); if (m) setDev(m); } catch (_) {}
  route();
  try { localStorage.removeItem('p2vl'); } catch (_) {}
  let saved = null; try { saved = localStorage.getItem('p2vl2'); } catch (_) {}
  if (saved) { try { const d = await unlock(saved); S.email = saved; load(d); startLog('open'); return; } catch (_) {} }
  gate('', saved || '');
})();
}
</script>
</body>
</html>
